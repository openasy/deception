# Deception. Canaries only an attacker would use; each use is a trigger, and an incident when Incidents is linked
# (ADR 0057).
#
#   openssl rand -hex 32 > openasy-kek   # deception's key: sign-in secrets and AWS canary secrets (ADR 0021). Keep it with your backups
#   docker compose up -d
#   docker compose logs deception | grep 'no owner yet'   # the one-time link that creates the owner account
services:
  deception:
    image: ghcr.io/openasy/deception:0.1.0
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    ports:
      - "127.0.0.1:8080:8080" # UI, API and canary URLs; put a TLS proxy in front to reach it from elsewhere
      # DNS canaries: publish the zone's name server on UDP 53, and delegate the zone to this host.
      # - "53:5353/udp"
    volumes:
      - deception-data:/data # SQLite database: canaries and triggers
    secrets:
      - openasy-kek # mounted at /run/secrets/openasy-kek
    environment:
      # The address people open Deception at; with a TLS proxy in front, its https:// URL.
      DECEPTION_PUBLIC_URL: ${DECEPTION_PUBLIC_URL:-http://localhost:8080}
      # Where URL canaries call. Another name on the same proxy keeps "deception" out of every bait.
      # DECEPTION_CANARY_URL: https://cdn.example.com
      # How many proxies add X-Forwarded-For in front of deception, so a trigger names the caller (1 behind one proxy).
      DECEPTION_PROXY_HOPS: ${DECEPTION_PROXY_HOPS:-0}
      # DNS canaries: the zone delegated to deception.
      # DECEPTION_DNS_ZONE: canary.example.com
      # For the CloudTrail pipeline of AWS key canaries: it can send events and nothing else.
      DECEPTION_INGEST_TOKEN: ${DECEPTION_INGEST_TOKEN:-}
      # Each trigger opens an incident: an Incidents API token with the editor role.
      # DECEPTION_INCIDENTS_URL: https://incidents.example.com
      # DECEPTION_INCIDENTS_TOKEN: ${DECEPTION_INCIDENTS_TOKEN}
      # Sign in with your identity provider (OIDC), see the README:
      # OPENASY_OIDC_ISSUER: https://login.example.com
      # OPENASY_OIDC_CLIENT_ID: deception
      # OPENASY_OIDC_CLIENT_SECRET: ${OPENASY_OIDC_CLIENT_SECRET}

volumes:
  deception-data:

secrets:
  openasy-kek:
    file: ./openasy-kek
